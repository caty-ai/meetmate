id: 001-wake-word-context-fix
title: Restore single-agent wake word wiring and block unnamed audio from LLM context
problem:
  - In single-agent Meet mode, wake-word boosting data is not reaching the STT pipeline because createPipeline() receives an empty agents map.
  - Unnamed meeting audio is stored in transcriptBuffer and later injected into the LLM context, causing context contamination and stop-command failures.
  - STT endpoint timing settings are sourced inconsistently, making live behavior harder to reason about and tune.
scope:
  - Pass a populated single-agent map into createPipeline() from src/transport-meet/meet-routes.js.
  - Ensure src/pipeline.js only injects addressed utterances into the LLM meeting context while preserving unnamed audio for operational buffering.
  - Ensure src/stt.js respects endpointing and utterance-end values passed from pipeline config.
non_goals:
  - Full wake-word redesign or final alias selection.
  - Complete ACP automation of the implementation and review pipeline.
  - Broad refactors outside the wake-word and transcript contamination path.
files_expected_to_change:
  - src/transport-meet/meet-routes.js
  - src/pipeline.js
  - src/stt.js
risks:
  - Filtering too aggressively could remove useful context for correctly addressed follow-up turns.
  - Wake-word recovery paths in pending queue handling could diverge from live-path behavior.
acceptance_criteria:
  - Single-agent Meet mode passes wakeWords, keyterms, and sttWakeVariants into the pipeline via a non-empty agents map.
  - Unnamed audio remains buffered for wake re-scan but is excluded from the LLM context block used for generation.
  - Pending queue replay uses the same context-injection rule as the live path.
  - STT endpointing and utterance-end values come from the resolved pipeline config, not only env fallbacks.
verification_steps:
  - Run node --check on src/transport-meet/meet-routes.js, src/pipeline.js, and src/stt.js.
  - Start a fresh Meet session and confirm logs show keyterms instead of (no keyterms) in the single-agent path.
  - In a live repro, verify unnamed meeting chatter does not appear in the LLM context block used for a directly addressed turn.
  - Verify a direct stop command such as ケイティ、ストップ can interrupt after unnamed chatter occurs.
rollback_plan:
  - Revert the three target files if wake detection drops further or direct-address turns stop responding.
  - If needed, temporarily restore previous behavior while keeping extra logging for addressed vs unnamed utterances.
reviewer_focus:
  - Check that currentAgent/defaultAgent behavior remains stable after single-agent map injection.
  - Check that transcriptBuffer filtering cannot starve the first addressed turn of needed context.
  - Check that STT timing changes do not silently alter other code paths.
