<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Meet Participant</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1rem;
            color: #e0e0e0;
        }
        .container {
            background: #16213e;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            border: 1px solid #0f3460;
        }
        h1 {
            text-align: center;
            color: #e94560;
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .mode-badge {
            text-align: center;
            margin-bottom: 2rem;
        }
        .mode-badge span {
            background: #0f3460;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #95b5d5;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: #aaa;
            font-size: 0.95rem;
            font-weight: 500;
        }
        input,
        textarea {
            padding: 0.85rem;
            border: 1px solid #0f3460;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            background-color: #1a1a2e;
            color: #e0e0e0;
        }
        textarea {
            min-height: 84px;
            resize: vertical;
            line-height: 1.5;
        }
        input:focus,
        textarea:focus {
            outline: 2px solid #e94560;
            outline-offset: 2px;
            border-color: #e94560;
        }
        .field-status {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #d5959b;
            min-height: 1.2rem;
        }
        .field-status.success {
            color: #95d5b2;
        }
        .agent-greeting {
            margin-top: 0.6rem;
            color: #95b5d5;
            font-size: 0.9rem;
            min-height: 1.2rem;
        }
        small {
            color: #666;
            margin-top: 0.3rem;
            font-size: 0.85rem;
        }

        button {
            margin-top: 1.5rem;
            padding: 1rem;
            background: linear-gradient(135deg, #e94560, #c23152);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
            transition: transform 0.1s;
        }
        button:hover {
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .aux-actions {
            margin-top: 1rem;
        }
        .link-button {
            display: none;
            box-sizing: border-box;
            width: 100%;
            margin-top: 0.75rem;
            padding: 0.9rem 1rem;
            background: linear-gradient(135deg, #0f3460, #16213e);
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #e0e0e0;
            text-decoration: none;
            text-align: center;
            font-size: 0.98rem;
            font-weight: 600;
            transition: transform 0.1s;
        }
        .link-button:hover {
            transform: translateY(-1px);
        }
        .status {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            display: none;
            line-height: 1.5;
        }
        .status.success {
            background: #1a3a2a;
            border: 1px solid #2d6a4f;
            color: #95d5b2;
            display: block;
        }
        .status.error {
            background: #3a1a1a;
            border: 1px solid #6a2d2d;
            color: #d5959b;
            display: block;
        }
        .status.loading {
            background: #1a2a3a;
            border: 1px solid #2d4a6a;
            color: #95b5d5;
            display: block;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Active session banner */
        .active-banner {
            display: none;
            background: #1a3a2a;
            border: 1px solid #2d6a4f;
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .active-banner.visible {
            display: block;
        }
        .active-banner .active-icon {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .active-banner .active-label {
            color: #95d5b2;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.3rem;
        }
        .active-banner .active-url {
            color: #6dba8a;
            font-size: 0.85rem;
            word-break: break-all;
            margin-bottom: 0.3rem;
        }
        .active-banner .active-state {
            color: #888;
            font-size: 0.8rem;
            margin-bottom: 0.8rem;
        }
        .active-banner .active-agents {
            color: #95d5b2;
            font-size: 0.85rem;
            margin-bottom: 0.6rem;
        }
        .leave-btn {
            margin-top: 0.5rem;
            padding: 0.7rem 1.5rem;
            background: linear-gradient(135deg, #e94560, #c23152);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: transform 0.1s;
        }
        .leave-btn:hover {
            transform: translateY(-1px);
        }
        .leave-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="pageTitle">🎙️ AI Meet Participant</h1>
        <p class="subtitle" id="pageSubtitle">AIエージェントをGoogle Meet / Zoomに参加させる</p>
        <div class="mode-badge"><span id="modeBadge">🐟 Fish Audio TTS</span></div>

        <!-- Active session banner -->
        <div id="activeBanner" class="active-banner">
            <div class="active-icon">🎙️</div>
            <div class="active-label">通話中</div>
            <div id="activeUrl" class="active-url"></div>
            <div id="activeState" class="active-state"></div>
            <div id="activeAgents" class="active-agents"></div>
            <button id="leaveBtn" class="leave-btn" onclick="leaveMeeting()">🚪 退出する</button>
        </div>

        <form id="joinForm">
            <label for="meetingText">📹 Meet情報（カレンダー/Slackの本文を貼り付け）:</label>
            <textarea
                id="meetingText"
                name="meetingText"
                placeholder="カレンダー招待文やSlackメッセージをそのまま貼り付けてください"
                title="Google Meet / Zoom URL を含むテキストを貼り付けてください"
                autofocus
                required
            ></textarea>
            <div id="meetingUrlStatus" class="field-status"></div>
            <small>貼り付けた内容から Google Meet / Zoom URL を自動で検出します</small>

            <div id="agentInfoDisplay" class="agent-greeting" style="margin-top: 1rem;"></div>

            <button type="submit" id="joinBtn">🚀 Meetに参加させる</button>
        </form>

        <div id="status" class="status"></div>

        <div class="aux-actions">
            <a id="calibrateLink" class="link-button" href="/calibrate">🎤 Wake Word Calibrate</a>
        </div>

    </div>

    <script>
        const form = document.getElementById('joinForm');
        const statusEl = document.getElementById('status');
        const submitBtn = document.getElementById('joinBtn');
        const meetingTextEl = document.getElementById('meetingText');
        const meetingUrlStatusEl = document.getElementById('meetingUrlStatus');
        const activeBanner = document.getElementById('activeBanner');
        const activeUrlEl = document.getElementById('activeUrl');
        const activeStateEl = document.getElementById('activeState');
        const activeAgentsEl = document.getElementById('activeAgents');
        const leaveBtn = document.getElementById('leaveBtn');
        const agentInfoEl = document.getElementById('agentInfoDisplay');
        const calibrateLink = document.getElementById('calibrateLink');
        let extractedMeetingUrl = '';
        let isSubmitting = false;
        let isLeaving = false;
        let hasActiveSession = false;
        let activeSessionId = null;
        let pollTimer = null;
        let availableAgents = [];
        let currentAgentId = "default";

        function setStatus(type, text, asHtml = false) {
            statusEl.className = `status ${type}`;
            if (asHtml) {
                statusEl.innerHTML = text;
            } else {
                statusEl.textContent = text;
            }
        }

        function updateSubmitButtonState() {
            const canSubmit = Boolean(extractedMeetingUrl) && !isSubmitting && !hasActiveSession;
            submitBtn.disabled = !canSubmit;
            if (hasActiveSession) {
                submitBtn.textContent = '🔒 通話中（退出してから再参加）';
            } else if (isSubmitting) {
                submitBtn.textContent = '⏳ 起動中...';
            } else {
                submitBtn.textContent = '🚀 Meetに参加させる';
            }
        }

        function stateLabel(state) {
            const labels = {
                initiating: '🔄 起動中...',
                joining: '🔄 参加中...',
                active: '🟢 通話中',
                speaking: '🎙️ 発話中',
                listening: '👂 聴取中',
                unknown: '🟡 接続中...',
            };
            return labels[state] || `🟡 ${state}`;
        }

        async function loadAgentsFromServer() {
            try {
                const res = await fetch('/agents');
                const data = await res.json();
                availableAgents = Array.isArray(data.agents) ? data.agents : [];
            } catch {
                availableAgents = [];
            }

            const agent = availableAgents[0];
            if (agent) {
                const dn = agent.displayName || agent.id;
                agentInfoEl.textContent = `🤖 エージェント: ${dn}`;
                document.title = `AI Meet Participant — ${dn}`;
                const titleEl = document.getElementById('pageTitle');
                if (titleEl) titleEl.textContent = `🎙️ AI Meet Participant — ${dn}`;
                const subtitleEl = document.getElementById('pageSubtitle');
                if (subtitleEl) subtitleEl.textContent = `${dn}をGoogle Meet / Zoomに参加させる`;
                currentAgentId = agent.id;
            } else {
                agentInfoEl.textContent = '利用可能なエージェントがありません';
            }
        }

        function updateActiveBanner(sessions) {
            if (sessions && sessions.length > 0) {
                const s = sessions[0];
                hasActiveSession = true;
                activeSessionId = s.sessionId;
                activeUrlEl.textContent = s.meetingUrl || '';
                activeStateEl.textContent = stateLabel(s.state) + (s.hasConnection ? '' : ' (WS未接続)');
                const fallbackName = availableAgents.length ? availableAgents[0].displayName : 'Agent';
                const names = Array.isArray(s.agentDisplayNames) && s.agentDisplayNames.length
                    ? s.agentDisplayNames.join(', ')
                    : fallbackName;
                activeAgentsEl.textContent = `Agent: ${names}`;
                activeBanner.classList.add('visible');
            } else {
                hasActiveSession = false;
                activeSessionId = null;
                activeBanner.classList.remove('visible');
                activeAgentsEl.textContent = '';
            }
            updateSubmitButtonState();
        }

        async function pollActiveSession() {
            try {
                const res = await fetch('/active-session');
                const data = await res.json();
                updateActiveBanner(data.sessions);
            } catch {
                // ignore
            }
        }

        function startPolling() {
            pollActiveSession();
            pollTimer = setInterval(pollActiveSession, 3000);
        }

        function stopPolling() {
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        }

        async function leaveMeeting() {
            if (isLeaving) return;
            isLeaving = true;
            leaveBtn.disabled = true;
            leaveBtn.textContent = '⏳ 退出中...';

            try {
                const body = new URLSearchParams({
                    sessionId: activeSessionId || '',
                });
                const res = await fetch('/leave-meeting', { method: 'POST', body });
                const text = await res.text();

                if (res.ok) {
                    setStatus('success', '🚪 ' + text);
                    // Force refresh after a moment
                    setTimeout(pollActiveSession, 1000);
                } else {
                    setStatus('error', '❌ ' + text);
                }
            } catch (err) {
                setStatus('error', '❌ 退出エラー: ' + err.message);
            } finally {
                isLeaving = false;
                leaveBtn.disabled = false;
                leaveBtn.textContent = '🚪 退出する';
            }
        }

        function decodeEscapedAngles(text) {
            let decoded = text || '';
            const maxPasses = 5;

            for (let i = 0; i < maxPasses; i += 1) {
                const next = decoded
                    .replace(/&amp;/gi, '&')
                    .replace(/&lt;/gi, '<')
                    .replace(/&gt;/gi, '>');
                if (next === decoded) break;
                decoded = next;
            }

            return decoded;
        }

        function isValidMeetPath(pathname) {
            return /^\/[a-z0-9]{3}-[a-z0-9]{4}-[a-z0-9]{3}\/?$/i.test(pathname || '');
        }

        function normalizeMeetingUrl(rawUrl) {
            if (!rawUrl) return '';
            let value = rawUrl.trim();
            if (!/^https?:\/\//i.test(value)) {
                value = `https://${value}`;
            }
            try {
                const parsed = new URL(value);
                parsed.protocol = 'https:';
                const host = parsed.hostname.toLowerCase();

                // Google Meet
                if (host === 'meet.google.com' && isValidMeetPath(parsed.pathname)) {
                    return parsed.toString();
                }
                // Zoom (*.zoom.us)
                if (host.endsWith('zoom.us') && /^\/(j|my)\/[a-zA-Z0-9]+/.test(parsed.pathname)) {
                    return parsed.toString();
                }
                return '';
            } catch {
                return '';
            }
        }

        function extractMeetingUrl(text) {
            const decoded = decodeEscapedAngles(text || '');
            // Try Google Meet first
            const meetRegex = /(?:https?:\/\/)?meet\.google\.com\/[a-z0-9]{3}-[a-z0-9]{4}-[a-z0-9]{3}(?:\?[^\s<>"'|)]*)?/i;
            const meetMatch = decoded.match(meetRegex);
            if (meetMatch) return normalizeMeetingUrl(meetMatch[0]);

            // Try Zoom
            const zoomRegex = /(?:https?:\/\/)?[\w.-]*zoom\.us\/(j|my)\/[a-zA-Z0-9?=&._%-]+/i;
            const zoomMatch = decoded.match(zoomRegex);
            if (zoomMatch) return normalizeMeetingUrl(zoomMatch[0]);

            return '';
        }

        function updateMeetingUrlStatus() {
            const text = meetingTextEl.value.trim();
            extractedMeetingUrl = extractMeetingUrl(text);

            if (!text) {
                meetingUrlStatusEl.textContent = '';
                meetingUrlStatusEl.className = 'field-status';
            } else if (extractedMeetingUrl) {
                meetingUrlStatusEl.textContent = `✅ 検出した URL: ${extractedMeetingUrl}`;
                meetingUrlStatusEl.className = 'field-status success';
            } else {
                meetingUrlStatusEl.textContent = 'Meet / Zoom URLが見つかりません';
                meetingUrlStatusEl.className = 'field-status';
            }

            updateSubmitButtonState();
        }

        // Public WSS URL from server (resolved via /info)
        let serverPublicWsUrl = '';

        // Auto-compute WebSocket URL from current page host
        function getAutoWsUrl() {
            // Prefer server-provided public WSS URL (ngrok)
            if (serverPublicWsUrl) return serverPublicWsUrl;
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            return `${proto}//${location.host}`;
        }

        // Fetch server info for mode badge + public WSS URL
        fetch('/info').then(r => r.json()).then(info => {
            const badge = document.getElementById('modeBadge');
            if (info.ttsProvider === 'fish-audio') {
                badge.textContent = '🐟 Fish Audio TTS';
            } else {
                badge.textContent = '🔊 Deepgram Voice Agent';
            }
            if (info.publicWsUrl) {
                serverPublicWsUrl = info.publicWsUrl;
            }
        }).catch(() => {});

        fetch('/calibrate/status')
            .then(r => r.ok ? r.json() : { enabled: false })
            .then(data => {
                if (data.enabled) {
                    calibrateLink.style.display = 'block';
                }
            })
            .catch(() => {});

        loadAgentsFromServer();

        meetingTextEl.addEventListener('input', updateMeetingUrlStatus);
        meetingTextEl.addEventListener('paste', () => {
            setTimeout(updateMeetingUrlStatus, 0);
        });
        updateMeetingUrlStatus();

        // Start polling for active sessions
        startPolling();

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            updateMeetingUrlStatus();
            if (!extractedMeetingUrl || isSubmitting || hasActiveSession) {
                if (hasActiveSession) {
                    setStatus('error', '🔒 既にアクティブなセッションがあります。退出してから再参加してください。');
                } else if (!extractedMeetingUrl) {
                    setStatus('error', '❌ Meet / Zoom URLが見つかりません');
                }
                return;
            }

            isSubmitting = true;
            updateSubmitButtonState();
            setStatus('loading', '⏳ Botを起動中...');

            try {
                const wsUrl = getAutoWsUrl();
                // Always use group mode (wake-word mode) — single-agent architecture
                const conversationMode = 'group';
                const selectedAgentIds = availableAgents.map(a => a.id);

                const botName = availableAgents.length
                    ? `${availableAgents[0].id} (${availableAgents[0].displayName})`
                    : 'Agent';

                const formData = new URLSearchParams({
                    meetingUrl: extractedMeetingUrl,
                    botName,
                    wsUrl,
                    conversationMode,
                    agentIds: selectedAgentIds.join(','),
                });

                const response = await fetch('/join-meeting', {
                    method: 'POST',
                    body: formData,
                });

                const text = await response.text();
                if (response.ok) {
                    setStatus('success',
                        '✅ ' + text +
                        '<br><small style="opacity:0.9">ミーティング画面でBotの参加を確認してください</small>',
                        true
                    );
                    // Immediately poll to show active banner
                    setTimeout(pollActiveSession, 500);
                } else {
                    setStatus('error', '❌ ' + text);
                }
            } catch (err) {
                setStatus('error', '❌ 接続エラー: ' + err.message);
            } finally {
                isSubmitting = false;
                updateSubmitButtonState();
            }
        });
    </script>
</body>
</html>
