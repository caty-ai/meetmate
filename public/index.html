<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Meet Participant</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1rem;
            color: #e0e0e0;
        }
        .container {
            background: #16213e;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            border: 1px solid #0f3460;
        }
        h1 {
            text-align: center;
            color: #e94560;
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .mode-badge {
            text-align: center;
            margin-bottom: 2rem;
        }
        .mode-badge span {
            background: #0f3460;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #95b5d5;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: #aaa;
            font-size: 0.95rem;
            font-weight: 500;
        }
        input,
        textarea {
            padding: 0.85rem;
            border: 1px solid #0f3460;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            background-color: #1a1a2e;
            color: #e0e0e0;
        }
        textarea {
            min-height: 84px;
            resize: vertical;
            line-height: 1.5;
        }
        input:focus,
        textarea:focus {
            outline: 2px solid #e94560;
            outline-offset: 2px;
            border-color: #e94560;
        }
        .field-status {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #d5959b;
            min-height: 1.2rem;
        }
        .field-status.success {
            color: #95d5b2;
        }
        .conversation-mode {
            margin-top: 1rem;
            display: grid;
            gap: 0.7rem;
        }
        .conversation-mode label {
            margin: 0;
            padding: 0.7rem 0.9rem;
            border: 1px solid #0f3460;
            border-radius: 8px;
            cursor: pointer;
            color: #d5d5d5;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .conversation-mode input[type="radio"] {
            margin: 0;
            accent-color: #e94560;
        }
        .agent-section {
            margin-top: 1rem;
            border: 1px solid #0f3460;
            border-radius: 10px;
            padding: 0.8rem;
            background: rgba(15, 52, 96, 0.2);
        }
        .agent-section select {
            width: 100%;
        }
        .agent-checklist {
            display: grid;
            gap: 0.5rem;
        }
        .agent-checklist label {
            margin: 0;
            padding: 0.55rem 0.7rem;
            border: 1px solid #0f3460;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            color: #d5d5d5;
        }
        .agent-checklist input[type="checkbox"] {
            accent-color: #e94560;
        }
        .agent-greeting {
            margin-top: 0.6rem;
            color: #95b5d5;
            font-size: 0.9rem;
            min-height: 1.2rem;
        }
        small {
            color: #666;
            margin-top: 0.3rem;
            font-size: 0.85rem;
        }
        .advanced-toggle {
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            user-select: none;
        }
        .advanced-toggle:hover {
            color: #aaa;
        }
        .advanced {
            display: none;
        }
        .advanced.open {
            display: block;
        }
        button {
            margin-top: 1.5rem;
            padding: 1rem;
            background: linear-gradient(135deg, #e94560, #c23152);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
            transition: transform 0.1s;
        }
        button:hover {
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            display: none;
            line-height: 1.5;
        }
        .status.success {
            background: #1a3a2a;
            border: 1px solid #2d6a4f;
            color: #95d5b2;
            display: block;
        }
        .status.error {
            background: #3a1a1a;
            border: 1px solid #6a2d2d;
            color: #d5959b;
            display: block;
        }
        .status.loading {
            background: #1a2a3a;
            border: 1px solid #2d4a6a;
            color: #95b5d5;
            display: block;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Cross-instance navigation */
        .instance-nav {
            margin-top: 2rem;
            padding-top: 1.2rem;
            border-top: 1px solid #0f3460;
            text-align: center;
        }
        .instance-nav .nav-label {
            color: #555;
            font-size: 0.75rem;
            margin-bottom: 0.6rem;
            letter-spacing: 0.05em;
        }
        .instance-nav .nav-links {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .instance-nav a {
            display: inline-block;
            padding: 0.45rem 0.9rem;
            background: #0f3460;
            color: #95b5d5;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: background 0.15s, color 0.15s;
        }
        .instance-nav a:hover {
            background: #1a4a7a;
            color: #c5d5e5;
        }
        .instance-nav a.current {
            background: #e94560;
            color: white;
            pointer-events: none;
            cursor: default;
        }

        /* Active session banner */
        .active-banner {
            display: none;
            background: #1a3a2a;
            border: 1px solid #2d6a4f;
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .active-banner.visible {
            display: block;
        }
        .active-banner .active-icon {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .active-banner .active-label {
            color: #95d5b2;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.3rem;
        }
        .active-banner .active-url {
            color: #6dba8a;
            font-size: 0.85rem;
            word-break: break-all;
            margin-bottom: 0.3rem;
        }
        .active-banner .active-state {
            color: #888;
            font-size: 0.8rem;
            margin-bottom: 0.8rem;
        }
        .active-banner .active-agents {
            color: #95d5b2;
            font-size: 0.85rem;
            margin-bottom: 0.6rem;
        }
        .leave-btn {
            margin-top: 0.5rem;
            padding: 0.7rem 1.5rem;
            background: linear-gradient(135deg, #e94560, #c23152);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: transform 0.1s;
        }
        .leave-btn:hover {
            transform: translateY(-1px);
        }
        .leave-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="pageTitle">🐱 AI Meet Participant</h1>
        <p class="subtitle" id="pageSubtitle">AIエージェントをGoogle Meet / Zoomに参加させる</p>
        <div class="mode-badge"><span id="modeBadge">🐟 Fish Audio TTS</span></div>

        <!-- Active session banner -->
        <div id="activeBanner" class="active-banner">
            <div class="active-icon">🎙️</div>
            <div class="active-label">通話中</div>
            <div id="activeUrl" class="active-url"></div>
            <div id="activeState" class="active-state"></div>
            <div id="activeAgents" class="active-agents"></div>
            <button id="leaveBtn" class="leave-btn" onclick="leaveMeeting()">🚪 退出する</button>
        </div>

        <form id="joinForm">
            <label for="meetingText">📹 Meet情報（カレンダー/Slackの本文を貼り付け）:</label>
            <textarea
                id="meetingText"
                name="meetingText"
                placeholder="カレンダー招待文やSlackメッセージをそのまま貼り付けてください"
                title="Google Meet / Zoom URL を含むテキストを貼り付けてください"
                autofocus
                required
            ></textarea>
            <div id="meetingUrlStatus" class="field-status"></div>
            <small>貼り付けた内容から Google Meet / Zoom URL を自動で検出します</small>

            <label id="agentSelectionSection">🤖 エージェント選択:</label>
            <div class="agent-section" id="agentSectionDiv">
                <div id="agentSingleWrap">
                    <select id="agentSelect"></select>
                </div>
                <div id="agentGroupWrap" style="display:none;">
                    <div id="agentCheckboxes" class="agent-checklist"></div>
                </div>
                <div id="agentGreetingPreview" class="agent-greeting"></div>
            </div>

            <label>💬 会話モード:</label>
            <div class="conversation-mode" id="modeSection">
                <label for="modeOneToOne">
                    <input type="radio" id="modeOneToOne" name="conversationMode" value="one_to_one" checked>
                    👤 1対1モード（常時会話）
                </label>
                <label for="modeGroup">
                    <input type="radio" id="modeGroup" name="conversationMode" value="group">
                    👥 複数人モード（ウェイクワード必須）
                </label>
            </div>

            <div class="advanced-toggle" onclick="toggleAdvanced()">▶ 詳細設定</div>
            <div class="advanced" id="advancedSection">
                <label for="botName">🤖 Bot名:</label>
                <input type="text" id="botName" name="botName" value="Caty (ケイティ)">

                <label for="wsUrl">🔗 WebSocket URL（自動設定）:</label>
                <input type="text" id="wsUrl" name="wsUrl" placeholder="自動設定されます">
                <small>空欄の場合、現在のホストから自動生成されます</small>
            </div>

            <button type="submit" id="joinBtn">🚀 Meetに参加させる</button>
        </form>

        <div id="status" class="status"></div>

        <!-- Cross-instance navigation -->
        <div class="instance-nav" id="instanceNav">
            <div class="nav-label">── 他のインスタンスへ ──</div>
            <div class="nav-links" id="navLinks">
                <a href="https://your-domain.ngrok.app" data-instance="caty">🐱 ケイティたち</a>
                <a href="https://your-domain.ngrok.dev" data-instance="claire">🌙 クレアたち</a>
                <a href="https://your-domain.ngrok.dev" data-instance="sebas">🎩 セバスたち</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('joinForm');
        const statusEl = document.getElementById('status');
        const submitBtn = document.getElementById('joinBtn');
        const meetingTextEl = document.getElementById('meetingText');
        const meetingUrlStatusEl = document.getElementById('meetingUrlStatus');
        const activeBanner = document.getElementById('activeBanner');
        const activeUrlEl = document.getElementById('activeUrl');
        const activeStateEl = document.getElementById('activeState');
        const activeAgentsEl = document.getElementById('activeAgents');
        const leaveBtn = document.getElementById('leaveBtn');
        const agentSelectEl = document.getElementById('agentSelect');
        const agentSingleWrapEl = document.getElementById('agentSingleWrap');
        const agentGroupWrapEl = document.getElementById('agentGroupWrap');
        const agentCheckboxesEl = document.getElementById('agentCheckboxes');
        const agentGreetingPreviewEl = document.getElementById('agentGreetingPreview');
        let extractedMeetingUrl = '';
        let isSubmitting = false;
        let isLeaving = false;
        let hasActiveSession = false;
        let activeSessionId = null;
        let pollTimer = null;
        let availableAgents = [];

        function setStatus(type, text, asHtml = false) {
            statusEl.className = `status ${type}`;
            if (asHtml) {
                statusEl.innerHTML = text;
            } else {
                statusEl.textContent = text;
            }
        }

        function toggleAdvanced() {
            const section = document.getElementById('advancedSection');
            const toggle = document.querySelector('.advanced-toggle');
            section.classList.toggle('open');
            toggle.textContent = section.classList.contains('open') ? '▼ 詳細設定' : '▶ 詳細設定';
        }

        function updateSubmitButtonState() {
            const canSubmit = Boolean(extractedMeetingUrl) && !isSubmitting && !hasActiveSession;
            submitBtn.disabled = !canSubmit;
            if (hasActiveSession) {
                submitBtn.textContent = '🔒 通話中（退出してから再参加）';
            } else if (isSubmitting) {
                submitBtn.textContent = '⏳ 起動中...';
            } else {
                submitBtn.textContent = '🚀 Meetに参加させる';
            }
        }

        function stateLabel(state) {
            const labels = {
                initiating: '🔄 起動中...',
                joining: '🔄 参加中...',
                active: '🟢 通話中',
                speaking: '🎙️ 発話中',
                listening: '👂 聴取中',
                unknown: '🟡 接続中...',
            };
            return labels[state] || `🟡 ${state}`;
        }

        function getConversationMode() {
            return (form.querySelector('input[name="conversationMode"]:checked') || {}).value || 'one_to_one';
        }

        function getSelectedAgentIds() {
            if (getConversationMode() === 'group') {
                return Array.from(agentCheckboxesEl.querySelectorAll('input[type="checkbox"]:checked'))
                    .map((el) => el.value)
                    .filter(Boolean);
            }
            const value = agentSelectEl.value;
            return value ? [value] : [];
        }

        function updateGreetingPreview() {
            if (!availableAgents.length) {
                agentGreetingPreviewEl.textContent = '利用可能なエージェントがありません（token未設定の可能性）。';
                return;
            }
            const selected = getSelectedAgentIds()
                .map((id) => availableAgents.find((a) => a.id === id))
                .filter(Boolean);
            if (!selected.length) {
                agentGreetingPreviewEl.textContent = 'エージェントを選択してください。';
                return;
            }
            const first = selected[0];
            if (selected.length === 1) {
                agentGreetingPreviewEl.textContent = `挨拶: ${first.greeting || '（未設定）'}`;
                return;
            }
            const names = selected.slice(1).map((a) => a.displayName || a.name).join('・');
            agentGreetingPreviewEl.textContent = `挨拶: ${first.greeting || '（未設定）'}（+ ${names} 参加）`;
        }

        function renderAgentSelector() {
            const mode = getConversationMode();
            agentSingleWrapEl.style.display = mode === 'group' ? 'none' : 'block';
            agentGroupWrapEl.style.display = mode === 'group' ? 'block' : 'none';
            updateGreetingPreview();
        }

        function populateAgents() {
            agentSelectEl.innerHTML = '';
            agentCheckboxesEl.innerHTML = '';

            if (!availableAgents.length) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = '利用可能なエージェントなし';
                agentSelectEl.appendChild(option);
                updateGreetingPreview();
                return;
            }

            for (const agent of availableAgents) {
                const option = document.createElement('option');
                option.value = agent.id;
                option.textContent = `${agent.displayName || agent.name} (${agent.name})`;
                if (agent.default) option.selected = true;
                agentSelectEl.appendChild(option);

                const label = document.createElement('label');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = agent.id;
                checkbox.checked = !!agent.default;
                checkbox.addEventListener('change', updateGreetingPreview);
                label.appendChild(checkbox);
                label.append(` ${(agent.displayName || agent.name)} (${agent.name})`);
                agentCheckboxesEl.appendChild(label);
            }

            if (!agentSelectEl.value) {
                agentSelectEl.value = availableAgents[0].id;
            }
            updateGreetingPreview();
        }

        let fixedAgentId = null;

        async function loadAgents() {
            try {
                const res = await fetch('/agents');
                const data = await res.json();
                availableAgents = Array.isArray(data.agents) ? data.agents : [];
                fixedAgentId = data.fixedAgentId || null;
            } catch {
                availableAgents = [];
            }
            populateAgents();
            renderAgentSelector();

            // In single-agent mode, hide agent selection but KEEP conversation mode toggle
            // Use fixedAgentId alone (not agent count) — tokens for other agents may exist
            if (fixedAgentId) {
                const agentLabel = document.getElementById('agentSelectionSection');
                if (agentLabel) agentLabel.style.display = 'none';
                const agentDiv = document.getElementById('agentSectionDiv');
                if (agentDiv) agentDiv.style.display = 'none';
                // Keep conversation mode visible — needed for wake mode in group meetings
                // Update page title
                const agent = availableAgents[0];
                document.title = `AI Meet Participant — ${agent.displayName || agent.name}`;
            }
        }

        function updateActiveBanner(sessions) {
            if (sessions && sessions.length > 0) {
                const s = sessions[0];
                hasActiveSession = true;
                activeSessionId = s.sessionId;
                activeUrlEl.textContent = s.meetingUrl || '';
                activeStateEl.textContent = stateLabel(s.state) + (s.hasConnection ? '' : ' (WS未接続)');
                const names = Array.isArray(s.agentDisplayNames) && s.agentDisplayNames.length
                    ? s.agentDisplayNames.join(', ')
                    : 'Caty';
                activeAgentsEl.textContent = `Agents: ${names}`;
                activeBanner.classList.add('visible');
            } else {
                hasActiveSession = false;
                activeSessionId = null;
                activeBanner.classList.remove('visible');
                activeAgentsEl.textContent = '';
            }
            updateSubmitButtonState();
        }

        async function pollActiveSession() {
            try {
                const res = await fetch('/active-session');
                const data = await res.json();
                updateActiveBanner(data.sessions);
            } catch {
                // ignore
            }
        }

        function startPolling() {
            pollActiveSession();
            pollTimer = setInterval(pollActiveSession, 3000);
        }

        function stopPolling() {
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        }

        async function leaveMeeting() {
            if (isLeaving) return;
            isLeaving = true;
            leaveBtn.disabled = true;
            leaveBtn.textContent = '⏳ 退出中...';

            try {
                const body = new URLSearchParams({
                    sessionId: activeSessionId || '',
                });
                const res = await fetch('/leave-meeting', { method: 'POST', body });
                const text = await res.text();

                if (res.ok) {
                    setStatus('success', '🚪 ' + text);
                    // Force refresh after a moment
                    setTimeout(pollActiveSession, 1000);
                } else {
                    setStatus('error', '❌ ' + text);
                }
            } catch (err) {
                setStatus('error', '❌ 退出エラー: ' + err.message);
            } finally {
                isLeaving = false;
                leaveBtn.disabled = false;
                leaveBtn.textContent = '🚪 退出する';
            }
        }

        function decodeEscapedAngles(text) {
            let decoded = text || '';
            const maxPasses = 5;

            for (let i = 0; i < maxPasses; i += 1) {
                const next = decoded
                    .replace(/&amp;/gi, '&')
                    .replace(/&lt;/gi, '<')
                    .replace(/&gt;/gi, '>');
                if (next === decoded) break;
                decoded = next;
            }

            return decoded;
        }

        function isValidMeetPath(pathname) {
            return /^\/[a-z0-9]{3}-[a-z0-9]{4}-[a-z0-9]{3}\/?$/i.test(pathname || '');
        }

        function normalizeMeetingUrl(rawUrl) {
            if (!rawUrl) return '';
            let value = rawUrl.trim();
            if (!/^https?:\/\//i.test(value)) {
                value = `https://${value}`;
            }
            try {
                const parsed = new URL(value);
                parsed.protocol = 'https:';
                const host = parsed.hostname.toLowerCase();

                // Google Meet
                if (host === 'meet.google.com' && isValidMeetPath(parsed.pathname)) {
                    return parsed.toString();
                }
                // Zoom (*.zoom.us)
                if (host.endsWith('zoom.us') && /^\/(j|my)\/[a-zA-Z0-9]+/.test(parsed.pathname)) {
                    return parsed.toString();
                }
                return '';
            } catch {
                return '';
            }
        }

        function extractMeetingUrl(text) {
            const decoded = decodeEscapedAngles(text || '');
            // Try Google Meet first
            const meetRegex = /(?:https?:\/\/)?meet\.google\.com\/[a-z0-9]{3}-[a-z0-9]{4}-[a-z0-9]{3}(?:\?[^\s<>"'|)]*)?/i;
            const meetMatch = decoded.match(meetRegex);
            if (meetMatch) return normalizeMeetingUrl(meetMatch[0]);

            // Try Zoom
            const zoomRegex = /(?:https?:\/\/)?[\w.-]*zoom\.us\/(j|my)\/[a-zA-Z0-9?=&._%-]+/i;
            const zoomMatch = decoded.match(zoomRegex);
            if (zoomMatch) return normalizeMeetingUrl(zoomMatch[0]);

            return '';
        }

        function updateMeetingUrlStatus() {
            const text = meetingTextEl.value.trim();
            extractedMeetingUrl = extractMeetingUrl(text);

            if (!text) {
                meetingUrlStatusEl.textContent = '';
                meetingUrlStatusEl.className = 'field-status';
            } else if (extractedMeetingUrl) {
                meetingUrlStatusEl.textContent = `✅ 検出した URL: ${extractedMeetingUrl}`;
                meetingUrlStatusEl.className = 'field-status success';
            } else {
                meetingUrlStatusEl.textContent = 'Meet / Zoom URLが見つかりません';
                meetingUrlStatusEl.className = 'field-status';
            }

            updateSubmitButtonState();
        }

        // Public WSS URL from server (resolved via /info)
        let serverPublicWsUrl = '';

        // Auto-compute WebSocket URL from current page host
        function getAutoWsUrl() {
            // Prefer server-provided public WSS URL (ngrok)
            if (serverPublicWsUrl) return serverPublicWsUrl;
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            return `${proto}//${location.host}`;
        }

        // Restore saved values
        ['botName'].forEach((id) => {
            const saved = localStorage.getItem('caty_' + id);
            if (saved) document.getElementById(id).value = saved;
        });

        // Fetch server info for mode badge + public WSS URL + agent branding
        fetch('/info').then(r => r.json()).then(info => {
            const badge = document.getElementById('modeBadge');
            if (info.ttsProvider === 'fish-audio') {
                badge.textContent = '🐟 Fish Audio TTS';
            } else {
                badge.textContent = '🔊 Deepgram Voice Agent';
            }
            if (info.publicWsUrl) {
                serverPublicWsUrl = info.publicWsUrl;
            }
            // Dynamic branding for single-agent mode
            if (info.primaryAgent) {
                const agent = info.primaryAgent;
                const dn = agent.displayName || agent.name;
                document.title = `AI Meet Participant — ${dn}`;
                const titleEl = document.getElementById('pageTitle');
                if (titleEl) titleEl.textContent = `🎙️ AI Meet Participant — ${dn}`;
                const subtitleEl = document.getElementById('pageSubtitle');
                if (subtitleEl) subtitleEl.textContent = `${dn}をGoogle Meet / Zoomに参加させる`;
                // Update bot name default
                const botNameEl = document.getElementById('botName');
                if (botNameEl && !localStorage.getItem('caty_botName')) {
                    botNameEl.value = `${agent.name} (${dn})`;
                }
            }
        }).catch(() => {});

        loadAgents();

        Array.from(form.querySelectorAll('input[name="conversationMode"]')).forEach((el) => {
            el.addEventListener('change', renderAgentSelector);
        });
        agentSelectEl.addEventListener('change', updateGreetingPreview);

        meetingTextEl.addEventListener('input', updateMeetingUrlStatus);
        meetingTextEl.addEventListener('paste', () => {
            setTimeout(updateMeetingUrlStatus, 0);
        });
        updateMeetingUrlStatus();

        // Start polling for active sessions
        startPolling();

        // Highlight current instance in nav
        (function highlightCurrentNav() {
            const host = location.hostname.toLowerCase();
            const links = document.querySelectorAll('#navLinks a');
            links.forEach(link => {
                try {
                    const linkHost = new URL(link.href).hostname.toLowerCase();
                    if (host === linkHost || host.startsWith(linkHost.split('.')[0])) {
                        link.classList.add('current');
                    }
                } catch {}
            });
        })();

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            updateMeetingUrlStatus();
            if (!extractedMeetingUrl || isSubmitting || hasActiveSession) {
                if (hasActiveSession) {
                    setStatus('error', '🔒 既にアクティブなセッションがあります。退出してから再参加してください。');
                } else if (!extractedMeetingUrl) {
                    setStatus('error', '❌ Meet / Zoom URLが見つかりません');
                }
                return;
            }

            isSubmitting = true;
            updateSubmitButtonState();
            setStatus('loading', '⏳ Botを起動中...');

            try {
                const botName = document.getElementById('botName').value.trim();
                const wsUrl = document.getElementById('wsUrl').value.trim() || getAutoWsUrl();
                const conversationMode = (form.querySelector('input[name="conversationMode"]:checked') || {}).value || 'one_to_one';
                const selectedAgentIds = getSelectedAgentIds();
                if (conversationMode === 'group' && selectedAgentIds.length === 0) {
                    setStatus('error', '❌ 複数人モードでは最低1つのエージェントを選択してください');
                    return;
                }

                const formData = new URLSearchParams({
                    meetingUrl: extractedMeetingUrl,
                    botName: botName || 'Caty (ケイティ)',
                    wsUrl,
                    conversationMode,
                    agentIds: selectedAgentIds.join(','),
                });

                const response = await fetch('/join-meeting', {
                    method: 'POST',
                    body: formData,
                });

                const text = await response.text();
                if (response.ok) {
                    localStorage.setItem('caty_botName', botName);
                    setStatus('success',
                        '✅ ' + text +
                        '<br><small style="opacity:0.9">ミーティング画面でBotの参加を確認してください 🐱</small>',
                        true
                    );
                    // Immediately poll to show active banner
                    setTimeout(pollActiveSession, 500);
                } else {
                    setStatus('error', '❌ ' + text);
                }
            } catch (err) {
                setStatus('error', '❌ 接続エラー: ' + err.message);
            } finally {
                isSubmitting = false;
                updateSubmitButtonState();
            }
        });
    </script>
</body>
</html>
