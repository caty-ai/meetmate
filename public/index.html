<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Meet Participant — Caty</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1rem;
            color: #e0e0e0;
        }
        .container {
            background: #16213e;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            border: 1px solid #0f3460;
        }
        h1 {
            text-align: center;
            color: #e94560;
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .mode-badge {
            text-align: center;
            margin-bottom: 2rem;
        }
        .mode-badge span {
            background: #0f3460;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #95b5d5;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: #aaa;
            font-size: 0.95rem;
            font-weight: 500;
        }
        input {
            padding: 0.85rem;
            border: 1px solid #0f3460;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            background-color: #1a1a2e;
            color: #e0e0e0;
        }
        input:focus {
            outline: 2px solid #e94560;
            outline-offset: 2px;
            border-color: #e94560;
        }
        small {
            color: #666;
            margin-top: 0.3rem;
            font-size: 0.85rem;
        }
        .advanced-toggle {
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            user-select: none;
        }
        .advanced-toggle:hover {
            color: #aaa;
        }
        .advanced {
            display: none;
        }
        .advanced.open {
            display: block;
        }
        button {
            margin-top: 1.5rem;
            padding: 1rem;
            background: linear-gradient(135deg, #e94560, #c23152);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
            transition: transform 0.1s;
        }
        button:hover {
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            display: none;
            line-height: 1.5;
        }
        .status.success {
            background: #1a3a2a;
            border: 1px solid #2d6a4f;
            color: #95d5b2;
            display: block;
        }
        .status.error {
            background: #3a1a1a;
            border: 1px solid #6a2d2d;
            color: #d5959b;
            display: block;
        }
        .status.loading {
            background: #1a2a3a;
            border: 1px solid #2d4a6a;
            color: #95b5d5;
            display: block;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐱 AI Meet Participant</h1>
        <p class="subtitle">Caty（ケイティ）をGoogle Meetに参加させる</p>
        <div class="mode-badge"><span id="modeBadge">🐟 Fish Audio TTS</span></div>

        <form id="joinForm">
            <label for="meetingUrl">📹 Meeting URL:</label>
            <input
                type="url"
                id="meetingUrl"
                name="meetingUrl"
                placeholder="https://meet.google.com/xxx-xxxx-xxx"
                pattern="https://meet\.google\.com/.+"
                title="Google Meet の URL を入力してください"
                autofocus
                required
            >
            <small>Google Meet のURLを貼り付けるだけ！他は自動設定されます ✨</small>

            <div class="advanced-toggle" onclick="toggleAdvanced()">▶ 詳細設定</div>
            <div class="advanced" id="advancedSection">
                <label for="botName">🤖 Bot名:</label>
                <input type="text" id="botName" name="botName" value="Caty (ケイティ)">

                <label for="wsUrl">🔗 WebSocket URL（自動設定）:</label>
                <input type="text" id="wsUrl" name="wsUrl" placeholder="自動設定されます">
                <small>空欄の場合、現在のホストから自動生成されます</small>
            </div>

            <button type="submit">🚀 Meetに参加させる</button>
        </form>

        <div id="status" class="status"></div>
    </div>

    <script>
        const form = document.getElementById('joinForm');
        const statusEl = document.getElementById('status');
        const submitBtn = form.querySelector('button[type="submit"]');

        function setStatus(type, text, asHtml = false) {
            statusEl.className = `status ${type}`;
            if (asHtml) {
                statusEl.innerHTML = text;
            } else {
                statusEl.textContent = text;
            }
        }

        function toggleAdvanced() {
            const section = document.getElementById('advancedSection');
            const toggle = document.querySelector('.advanced-toggle');
            section.classList.toggle('open');
            toggle.textContent = section.classList.contains('open') ? '▼ 詳細設定' : '▶ 詳細設定';
        }

        // Public WSS URL from server (resolved via /info)
        let serverPublicWsUrl = '';

        // Auto-compute WebSocket URL from current page host
        function getAutoWsUrl() {
            // Prefer server-provided public WSS URL (ngrok)
            if (serverPublicWsUrl) return serverPublicWsUrl;
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            return `${proto}//${location.host}`;
        }

        // Restore saved values
        ['botName'].forEach((id) => {
            const saved = localStorage.getItem('caty_' + id);
            if (saved) document.getElementById(id).value = saved;
        });

        // Fetch server info for mode badge + public WSS URL
        fetch('/info').then(r => r.json()).then(info => {
            const badge = document.getElementById('modeBadge');
            if (info.ttsProvider === 'fish-audio') {
                badge.textContent = '🐟 Fish Audio TTS';
            } else {
                badge.textContent = '🔊 Deepgram Voice Agent';
            }
            if (info.publicWsUrl) {
                serverPublicWsUrl = info.publicWsUrl;
            }
        }).catch(() => {});

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ 起動中...';
            setStatus('loading', '⏳ Botを起動中...');

            try {
                const meetingUrl = document.getElementById('meetingUrl').value.trim();
                const botName = document.getElementById('botName').value.trim();
                const wsUrl = document.getElementById('wsUrl').value.trim() || getAutoWsUrl();

                const formData = new URLSearchParams({
                    meetingUrl,
                    botName: botName || 'Caty (ケイティ)',
                    wsUrl,
                });

                const response = await fetch('/join-meeting', {
                    method: 'POST',
                    body: formData,
                });

                const text = await response.text();
                if (response.ok) {
                    localStorage.setItem('caty_botName', botName);
                    setStatus('success',
                        '✅ ' + text +
                        '<br><small style="opacity:0.9">Google Meet画面でBotの参加を確認してください 🐱</small>',
                        true
                    );
                } else {
                    setStatus('error', '❌ ' + text);
                }
            } catch (err) {
                setStatus('error', '❌ 接続エラー: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Meetに参加させる';
            }
        });
    </script>
</body>
</html>
