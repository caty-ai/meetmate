name: test

# Post-merge canary + README badge source (badge.svg?branch=main). PR-time
# testing moved to the family test-lint gate (test-lint.yml → reusable
# @ci-v1, runs `make test` with armed T-6 suite reconciliation); running the
# suite twice per PR would only add wall-clock.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # >= 26.7.0 only: Node 22 fails with cancelledByParent/"Promise
          # resolution is still pending"; Node 26.0–26.6 flake on
          # nodejs/node#64061 (fixed in 26.7.0). This matches the floor in
          # scripts/ci/ensure-node.sh; see docs/test-runner-node-floor.md (#38).
          node-version: '>=26.7.0 <27'
          cache: npm
      - run: npm ci
      # Serialized on purpose so the canary's timing stays close to `make test`
      # (one process per suite).
      - run: node --test --test-concurrency=1
