name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 26.x only: the suite relies on Node 26 test-runner async semantics.
          # Node 22 fails with cancelledByParent/"Promise resolution is still
          # pending" (measured on this PR's first run) despite engines >=22.
          node-version: 26.x
          cache: npm
      - run: npm ci
      # Serialized on purpose: Node 26's parallel test-runner worker IPC is
      # flaky for this suite, and serial passes on both matrix versions.
      - run: node --test --test-concurrency=1
