name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # engines floor (22) and the version the suite is verified on locally (26).
        node-version: [22.x, 26.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Serialized on purpose: Node 26's parallel test-runner worker IPC is
      # flaky for this suite, and serial passes on both matrix versions.
      - run: node --test --test-concurrency=1
