name: Risk Review Gate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
permissions: {contents: read}
concurrency: {group: 'risk-review-${{ github.event.pull_request.number }}', cancel-in-progress: true}
jobs:
  risk-review-gate:
    uses: caty-ai/family-dev-handbook/.github/workflows/reusable-review-labels.yml@ci-v1
    permissions: {contents: read, issues: read, pull-requests: write}
    with:
      risk_paths_billing: |
        src/llm-openai.js
        src/stt-soniox.js
        src/stt.js
        src/tts-fish.js
      risk_paths_outbound: |
        src/slack-notifier.js
        src/attendee-chat.js
        src/gateway-events.js
        src/gateway-warmup.js
        src/llm-openai.js
        src/llm-openclaw.js
        src/tts-fish.js
        src/stt-soniox.js
        src/stt.js
        src/pipeline.js
        src/stt-provider.js
        src/llm-provider.js
        src/mcp/server.js
      risk_paths_gates: |
        .github/workflows/**
        .github/risk-reviewers.txt
        Makefile
        scripts/ci/**
        tools/check_publication_gate.py
        .publication-denylist
        package.json
        package-lock.json
        .gitignore
      risk_paths_auth: |
        src/transport-meet/meet-routes.js
        src/server.js
        src/config.js
        src/wake-calibrate/calibrate-routes.js
        src/mcp/server.js
        src/transport-meet/local-avatar-session.js
        src/ui-routes.js
