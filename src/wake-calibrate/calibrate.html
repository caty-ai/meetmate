<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wake Word Calibration</title>
    <link rel="stylesheet" href="/style.css">
    <script>
        // Apply stored theme before first paint (shared key with main screen)
        try {
            const t = localStorage.getItem('theme');
            if (t === 'dark' || t === 'light') {
                document.documentElement.setAttribute('data-theme', t);
            }
        } catch { /* ignore */ }
    </script>
    <style>
        /* Calibrate-specific styles on top of the shared design system */
        .page-narrow { max-width: 560px; }

        .target-word {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--accent);
            margin: 0 0 18px;
            padding: 16px;
            background: var(--accent-soft);
            border: 1px solid var(--hairline);
            border-radius: 8px;
        }

        .screen-note {
            text-align: center;
            color: var(--ink-muted);
            font-size: 13px;
            line-height: 1.7;
            margin: 0 0 4px;
        }

        .rec-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }
        .rec-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--danger);
            letter-spacing: 0.01em;
        }
        .rec-label .pulse-dot {
            background: var(--danger);
            animation-name: pulse-ring-danger;
        }
        @keyframes pulse-ring-danger {
            0% { box-shadow: 0 0 0 0 rgba(178,59,52,0.35); }
            70% { box-shadow: 0 0 0 8px rgba(0,0,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
        }
        .timer {
            font-size: 26px;
            font-weight: 700;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }

        .transcript-area {
            max-height: 250px;
            overflow-y: auto;
            padding: 12px 14px;
            background: var(--bg-sunken);
            border: 1px solid var(--hairline);
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.7;
        }
        .transcript-area:empty::before {
            content: 'マイクに向かってウェイクワードを繰り返してください...';
            color: var(--ink-faint);
        }
        .word-interim { color: var(--ink-faint); }
        .word-final { color: var(--ink); }

        .results-note {
            text-align: center;
            color: var(--ink-muted);
            font-size: 13px;
            margin: 0 0 4px;
        }
        .results-list {
            margin: 12px 0 0;
            list-style: none;
            padding: 0;
            border-top: 1px solid var(--hairline);
        }
        .results-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 11px 4px;
            border-bottom: 1px solid var(--hairline);
            font-size: 14px;
        }
        .results-list .variant-text { color: var(--ink); }
        .results-list .variant-count {
            color: var(--accent);
            font-weight: 600;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }
        .results-list li.empty {
            justify-content: center;
            color: var(--ink-muted);
        }

        .btn-secondary {
            width: 100%;
            margin-top: 10px;
            background: var(--bg-sunken);
            border: 1px solid var(--hairline);
            color: var(--ink-secondary);
            transition: border-color 0.2s, color 0.2s;
        }
        .btn-secondary:hover:not(:disabled) { border-color: var(--hairline-strong); color: var(--ink); }
        .btn-secondary:active:not(:disabled) { transform: scale(0.97); transition: transform 0.25s var(--ease-puyo); }
        .btn-stop {
            width: 100%;
            margin-top: 14px;
        }

        .status-msg {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
        }
        .status-msg.success {
            background: var(--success-soft);
            border: 1px solid var(--success-border);
            color: var(--success);
            font-weight: 600;
        }
        .status-msg.error {
            background: var(--danger-soft);
            border: 1px solid rgba(178,59,52,0.22);
            color: var(--danger);
        }

        .back-wrap { margin-top: 16px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="page page-narrow">
        <div class="header reveal reveal-1">
            <div class="header-id">
                <div>
                    <span class="eyebrow">Meetmate</span>
                    <h1 class="agent-name">Wake Word Calibration</h1>
                </div>
            </div>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="ダークモード切り替え">
                <span id="themeLabel">ライト</span>
                <span class="switch"></span>
            </button>
        </div>

        <section class="card reveal reveal-2">
            <p class="card-sub">STTがどう聞き取るかを確認し、バリアントを登録します</p>

            <div class="target-word" id="targetWord">...</div>

            <!-- Screen: Ready -->
            <div id="screenReady">
                <p class="screen-note">
                    ターゲットワードを色々な言い方で繰り返し発話してください。<br>
                    STTが検出した表記ゆれを自動収集します。
                </p>
                <button class="btn btn-primary" id="btnStart"><span class="btn-label">録音開始</span></button>
            </div>

            <!-- Screen: Recording -->
            <div id="screenRecording" class="hidden">
                <div class="rec-top">
                    <span class="rec-label"><span class="pulse-dot"></span> 録音中</span>
                    <span class="timer" id="timer">30</span>
                </div>
                <div class="transcript-area" id="transcriptArea"></div>
                <button class="btn btn-danger btn-stop" id="btnStop">停止</button>
            </div>

            <!-- Screen: Results -->
            <div id="screenResults" class="hidden">
                <p class="results-note">検出されたバリアント（出現回数順）</p>
                <ul class="results-list" id="resultsList"></ul>
                <button class="btn btn-primary" id="btnSave"><span class="btn-label">承認して保存</span></button>
                <button class="btn btn-secondary" id="btnRetry">やり直し</button>
            </div>

            <!-- Screen: Saved -->
            <div id="screenSaved" class="hidden">
                <div id="saveResult" class="status-msg success"></div>
                <button class="btn btn-secondary" id="btnAgain">もう一度キャリブレーション</button>
            </div>

            <!-- Error display -->
            <div id="errorMsg" class="status-msg error hidden"></div>
        </section>

        <div class="back-wrap reveal reveal-3">
            <a href="/" class="link-button">メイン画面に戻る</a>
        </div>
    </div>

    <script>
        // Elements
        const targetWordEl = document.getElementById('targetWord');
        const screenReady = document.getElementById('screenReady');
        const screenRecording = document.getElementById('screenRecording');
        const screenResults = document.getElementById('screenResults');
        const screenSaved = document.getElementById('screenSaved');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnSave = document.getElementById('btnSave');
        const btnSaveLabel = btnSave.querySelector('.btn-label');
        const btnRetry = document.getElementById('btnRetry');
        const btnAgain = document.getElementById('btnAgain');
        const timerEl = document.getElementById('timer');
        const transcriptArea = document.getElementById('transcriptArea');
        const resultsList = document.getElementById('resultsList');
        const saveResultEl = document.getElementById('saveResult');
        const errorMsgEl = document.getElementById('errorMsg');

        // --- Theme (shared with main screen: localStorage key `theme`) ---
        const root = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const themeLabel = document.getElementById('themeLabel');

        function currentIsDark() {
            const attr = root.getAttribute('data-theme');
            if (attr === 'dark') return true;
            if (attr === 'light') return false;
            return window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        function applyThemeUI() {
            const dark = currentIsDark();
            root.setAttribute('data-dark', dark ? 'true' : 'false');
            themeLabel.textContent = dark ? 'ダーク' : 'ライト';
        }

        applyThemeUI();

        themeToggle.addEventListener('click', () => {
            const nextTheme = currentIsDark() ? 'light' : 'dark';
            root.setAttribute('data-theme', nextTheme);
            try { localStorage.setItem('theme', nextTheme); } catch { /* ignore */ }
            applyThemeUI();
        });

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => {
            if (!root.getAttribute('data-theme')) applyThemeUI();
        });

        // --- Calibration logic (unchanged) ---
        let agentName = '';
        let wakeWords = [];
        let ws = null;
        let mediaStream = null;
        let audioContext = null;
        let countdownInterval = null;
        let secondsLeft = 30;
        let settingsRevision = null;
        // { normalizedText: { original: string, count: number } }
        let detectedVariants = {};

        function showScreen(screen) {
            [screenReady, screenRecording, screenResults, screenSaved].forEach(
                s => s.classList.add('hidden')
            );
            screen.classList.remove('hidden');
            errorMsgEl.classList.add('hidden');
        }

        function showError(msg) {
            errorMsgEl.textContent = msg;
            errorMsgEl.classList.remove('hidden');
        }

        function normalizeLower(s) {
            let r = s.trim().toLowerCase();
            r = r.replace(/[\uff01-\uff5e]/g, ch =>
                String.fromCharCode(ch.charCodeAt(0) - 0xfee0)
            );
            r = r.replace(/\u3000/g, ' ');
            r = r.replace(/[〜～]/g, 'ー');
            return r;
        }

        // Load agent info
        async function init() {
            try {
                const [agentRes, statusRes] = await Promise.all([fetch('/agents'), fetch('/calibrate/status')]);
                const [data, status] = await Promise.all([agentRes.json(), statusRes.json()]);
                settingsRevision = status.revision;
                const agents = Array.isArray(data.agents) ? data.agents : [];
                if (agents.length > 0) {
                    const agent = agents[0];
                    agentName = agent.displayName || agent.name || agent.id;
                    wakeWords = (agent.wakeWords || []).map(normalizeLower);
                    // Show primary wake word as target (more accurate than displayName)
                    const primaryWakeWord = (agent.wakeWords || [])[0];
                    targetWordEl.textContent = primaryWakeWord || agentName;
                    document.title = `Wake Word Calibration — ${agentName}`;
                } else {
                    targetWordEl.textContent = '(エージェント未設定)';
                }
            } catch {
                targetWordEl.textContent = '(取得エラー)';
            }
        }

        function addTranscriptLine(text, isFinal) {
            const span = document.createElement('div');
            span.className = isFinal ? 'word-final' : 'word-interim';
            span.textContent = (isFinal ? '✓ ' : '… ') + text;
            transcriptArea.appendChild(span);
            transcriptArea.scrollTop = transcriptArea.scrollHeight;

            // Record tokens only from completed utterances.
            if (isFinal && text.trim()) {
                const tokens = text.split(/[\s、。！？!?,.\-]+/).filter(Boolean);
                for (const token of tokens) {
                    const norm = normalizeLower(token);
                    if (!norm) continue;
                    if (!detectedVariants[norm]) {
                        detectedVariants[norm] = { original: token, count: 0 };
                    }
                    detectedVariants[norm].count++;
                }
            }
        }

        async function startRecording() {
            detectedVariants = {};
            transcriptArea.innerHTML = '';
            secondsLeft = 30;
            timerEl.textContent = '30';
            showScreen(screenRecording);

            // Get mic
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        sampleRate: 16000,
                        echoCancellation: true,
                        noiseSuppression: true,
                    }
                });
            } catch (err) {
                showScreen(screenReady);
                showError('マイクのアクセスが拒否されました: ' + err.message);
                return;
            }

            // Open WS
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/calibrate/stream`);
            ws.binaryType = 'arraybuffer';

            ws.onopen = async () => {
                await startAudioCapture();
                startCountdown();
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'transcript') {
                        addTranscriptLine(msg.text, msg.isFinal);
                    } else if (msg.type === 'timeout') {
                        stopRecording();
                    } else if (msg.type === 'error') {
                        showError('STTエラー: ' + msg.message);
                        stopRecording();
                    }
                } catch { /* ignore */ }
            };

            ws.onerror = () => {
                showError('WebSocket接続エラー');
                stopRecording();
            };

            ws.onclose = () => {
                // If still on recording screen, auto-stop
                if (!screenRecording.classList.contains('hidden')) {
                    showResults();
                }
            };
        }

        async function startAudioCapture() {
            audioContext = new AudioContext({ sampleRate: 16000 });
            // Ensure AudioContext is running (Chrome/Safari autoplay policy)
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            const source = audioContext.createMediaStreamSource(mediaStream);

            // Use ScriptProcessorNode for broad compatibility
            const processor = audioContext.createScriptProcessor(4096, 1, 1);
            processor.onaudioprocess = (e) => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                const float32 = e.inputBuffer.getChannelData(0);
                const int16 = new Int16Array(float32.length);
                for (let i = 0; i < float32.length; i++) {
                    const s = Math.max(-1, Math.min(1, float32[i]));
                    int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                ws.send(int16.buffer);
            };
            source.connect(processor);
            processor.connect(audioContext.destination);
        }

        function startCountdown() {
            countdownInterval = setInterval(() => {
                secondsLeft--;
                timerEl.textContent = String(secondsLeft);
                if (secondsLeft <= 0) {
                    stopRecording();
                }
            }, 1000);
        }

        function stopRecording() {
            if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
            if (audioContext) { audioContext.close().catch(() => {}); audioContext = null; }
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
            if (ws && ws.readyState <= 1) { ws.close(); }
            ws = null;
            showResults();
        }

        function showResults() {
            // Filter out exact wake word matches and sort by count
            const entries = Object.entries(detectedVariants)
                .filter(([norm]) => !wakeWords.includes(norm))
                .sort((a, b) => b[1].count - a[1].count);

            resultsList.innerHTML = '';

            if (entries.length === 0) {
                const li = document.createElement('li');
                li.textContent = 'バリアントが検出されませんでした';
                li.classList.add('empty');
                resultsList.appendChild(li);
                btnSave.disabled = true;
            } else {
                btnSave.disabled = false;
                for (const [, { original, count }] of entries) {
                    const li = document.createElement('li');
                    const textSpan = document.createElement('span');
                    textSpan.className = 'variant-text';
                    textSpan.textContent = original;
                    const countSpan = document.createElement('span');
                    countSpan.className = 'variant-count';
                    countSpan.textContent = `×${count}`;
                    li.appendChild(textSpan);
                    li.appendChild(countSpan);
                    resultsList.appendChild(li);
                }
            }

            showScreen(screenResults);
        }

        async function saveVariants() {
            const variants = Object.entries(detectedVariants)
                .filter(([norm]) => !wakeWords.includes(norm))
                .map(([, { original }]) => original);

            if (variants.length === 0) {
                showError('保存するバリアントがありません');
                return;
            }

            btnSave.disabled = true;
            btnSaveLabel.textContent = '保存中...';

            try {
                const res = await fetch('/calibrate/apply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ variants, revision: settingsRevision }),
                });
                const data = await res.json();

                if (data.ok) {
                    settingsRevision = data.revision;
                    saveResultEl.className = 'status-msg success';
                    saveResultEl.textContent = `${data.added}件の新しいバリアントを追加しました（合計: ${data.total}件）`;
                    showScreen(screenSaved);
                } else {
                    showError('保存エラー: ' + (data.error || '不明なエラー'));
                    btnSave.disabled = false;
                    btnSaveLabel.textContent = '承認して保存';
                }
            } catch (err) {
                showError('保存エラー: ' + err.message);
                btnSave.disabled = false;
                btnSaveLabel.textContent = '承認して保存';
            }
        }

        function resetToReady() {
            detectedVariants = {};
            transcriptArea.innerHTML = '';
            showScreen(screenReady);
        }

        // Event listeners
        btnStart.addEventListener('click', startRecording);
        btnStop.addEventListener('click', stopRecording);
        btnSave.addEventListener('click', saveVariants);
        btnRetry.addEventListener('click', resetToReady);
        btnAgain.addEventListener('click', resetToReady);

        init();
    </script>
</body>
</html>
